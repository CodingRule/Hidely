<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hidely</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="shell">
      <header class="titlebar" data-tauri-drag-region>
        <div class="lights">
          <button id="win-close" type="button" class="light close" aria-label="Close to tray">
            <svg viewBox="0 0 10 10" aria-hidden="true"><path d="m3 3 4 4m0-4-4 4" /></svg>
          </button>
          <button id="win-min" type="button" class="light min" aria-label="Minimize">
            <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2.500 5h5" /></svg>
          </button>
          <button id="win-max" type="button" class="light max" aria-label="Maximize">
            <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M5 2.500v5M2.500 5h5" /></svg>
          </button>
        </div>

        <div class="brand" data-tauri-drag-region>
          <svg viewBox="0 0 24 24" aria-hidden="true" data-tauri-drag-region>
            <path
              d="M12 2.500a7.500 7.500 0 0 0-7.500 7.500v10.200l2.500-2.100 2.500 2.100 2.500-2.100 2.500 2.100 2.500-2.100 2.500 2.100V10A7.500 7.500 0 0 0 12 2.500Zm-2.800 6.200a1.300 1.600 0 1 1 0 3.200 1.300 1.600 0 0 1 0-3.200Zm5.600 0a1.300 1.600 0 1 1 0 3.200 1.300 1.600 0 0 1 0-3.200Z"
              fill="currentColor"
              fill-rule="evenodd"
            />
          </svg>
          <span data-tauri-drag-region>Hidely</span>
        </div>

        <div id="state" class="state">
          <span class="dot" aria-hidden="true"></span>
          <span id="summary">Nothing hidden</span>
        </div>
      </header>

      <div class="workspace">
        <aside class="sidebar pane">
          <nav aria-label="Filter windows">
            <button type="button" class="filter" data-filter="all" aria-pressed="true">
              <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="9.500" height="7.500" rx="1.500" /><path d="M5 13h7.500a1.500 1.500 0 0 0 1.500-1.500V6" /></svg>
              <span>All windows</span>
              <span class="count" id="count-all">0</span>
            </button>
            <button type="button" class="filter" data-filter="pinned" aria-pressed="false">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2.500h4l-.600 4 2.100 2.200v1.300h-7V8.700l2.100-2.200-.600-4ZM8 10v3.800" /></svg>
              <span>Pinned</span>
              <span class="count" id="count-pinned">0</span>
            </button>
            <button type="button" class="filter" data-filter="hidden" aria-pressed="false">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 2l12 12M6.500 6.600a2 2 0 0 0 2.900 2.800M4.300 4.500C2.700 5.500 1.700 7 1.500 8c.500 1.800 3 4.500 6.500 4.500 1 0 1.900-.200 2.700-.600M7 3.600c.300-.100.700-.100 1-.100 3.500 0 6 2.700 6.500 4.500-.200.700-.700 1.600-1.500 2.400" /></svg>
              <span>Hidden</span>
              <span class="count" id="count-hidden">0</span>
            </button>
          </nav>

          <dl id="hotkeys" class="hotkeys" aria-label="Keyboard shortcuts"></dl>
        </aside>

        <main class="panel pane">
          <div class="toolbar">
            <button id="show-all" type="button" class="pill">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.500 8C2 6.200 4.500 3.500 8 3.500s6 2.700 6.500 4.500c-.500 1.800-3 4.500-6.500 4.500S2 9.800 1.500 8Z" /><circle cx="8" cy="8" r="2" /></svg>
              Show everything
            </button>
            <label class="search">
              <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.500" /><path d="m10.500 10.500 3.500 3.500" /></svg>
              <input id="search" type="search" placeholder="Search windows" aria-label="Search windows" autocomplete="off" spellcheck="false" />
            </label>
          </div>

          <div class="heading">
            <h1 id="list-title">All windows</h1>
            <span id="total"></span>
          </div>

          <div class="table">
            <table aria-labelledby="list-title">
              <colgroup>
                <col />
                <col class="c-app" />
                <col class="c-status" />
                <col class="c-actions" />
              </colgroup>
              <thead>
                <tr>
                  <th scope="col">Name</th>
                  <th scope="col" class="app">App</th>
                  <th scope="col">Status</th>
                  <th scope="col"><span class="sr-only">Actions</span></th>
                </tr>
              </thead>
              <tbody id="windows"></tbody>
            </table>
            <p id="empty" class="empty" hidden></p>
          </div>

          <p id="status" class="error" role="status"></p>
        </main>
      </div>
    </div>

    <script src="main.js"></script>
  </body>
</html>

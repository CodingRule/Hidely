name: Feature request
description: Suggest something Hidely should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation, not just the feature. It helps find the best fix.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Hidely to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you've tried instead?
